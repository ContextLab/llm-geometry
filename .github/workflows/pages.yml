name: Deploy static site to GitHub Pages

# Builds the fully static app (no Python backend at runtime): the REAL backend runs
# once here as a build tool, exporting checkpoint/golden/graph/trace/tile/preset
# artifacts, then the frontend builds in static mode and deploys to
# https://context-lab.com/llm-geometry/ (Pages source: GitHub Actions).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # first cold run downloads models + computes all presets; warm runs take minutes
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: code/backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: code/frontend/package-lock.json
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-v2-${{ github.run_id }}
          restore-keys: |
            hf-models-${{ runner.os }}-v2-
      - name: Cache derived artifacts
        uses: actions/cache@v4
        with:
          path: .cache/llm-geometry
          key: llmgeo-cache-${{ runner.os }}-v2-${{ github.run_id }}
          restore-keys: |
            llmgeo-cache-${{ runner.os }}-v2-
      - name: Install backend (build tool for the export)
        working-directory: code/backend
        run: |
          python -m pip install --upgrade pip
          grep -v '^-e ' requirements.lock > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
          pip install -e . --no-deps
      - name: Export static assets with the real backend
        run: |
          python scripts/export_static_assets.py \
            --git-sha "${GITHUB_SHA}" \
            --generated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Build frontend (static mode, Pages base path)
        working-directory: code/frontend
        env:
          VITE_DATA_MODE: static
          PAGES_BASE: /llm-geometry/
        run: |
          sh ../../scripts/npm-ci-retry.sh
          npm run build
          cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: code/frontend/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
