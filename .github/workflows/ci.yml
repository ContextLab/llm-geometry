name: CI

# Everything runs against REAL models (project policy: no mocks) — HF downloads and
# the tiny-model training are cached between runs. PR gate = backend + frontend + e2e;
# the nightly schedule re-runs the same suites cold-cache-tolerant.
on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 8 * * *" # nightly full pass
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: code/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: code/backend/requirements.lock
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-v1
      - name: Cache derived artifacts (tiny-model checkpoints, graphs)
        uses: actions/cache@v4
        with:
          path: .cache/llm-geometry
          key: llmgeo-cache-${{ runner.os }}-${{ hashFiles('code/backend/src/llm_geometry/geo/config.py') }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          grep -v '^-e ' requirements.lock > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
          pip install -e ".[test]" --no-deps
      - name: Lint (ruff + black)
        run: |
          ruff check src/ tests/
          black --check src/
      - name: Tests (real models, no mocks)
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: code/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: code/frontend/package-lock.json
      # The staticClient/geoEngine unit tests consume REAL exporter output
      # (git-ignored static-data), so this job runs the backend once as a build
      # tool — same pattern as the e2e and pages jobs.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: code/backend/requirements.lock
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-v1
      - name: Cache derived artifacts
        uses: actions/cache@v4
        with:
          path: .cache/llm-geometry
          key: llmgeo-cache-${{ runner.os }}-${{ hashFiles('code/backend/src/llm_geometry/geo/config.py') }}
      - name: Install backend (static-asset exporter)
        working-directory: code/backend
        run: |
          python -m pip install --upgrade pip
          grep -v '^-e ' requirements.lock > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
          pip install -e . --no-deps
      - name: Export static assets (--quick)
        working-directory: .
        run: |
          python scripts/export_static_assets.py --quick \
            --git-sha "${GITHUB_SHA}" --generated-at ci
      - name: Install
        run: npm ci
      - name: Typecheck (svelte-check)
        run: npm run check
      - name: Unit tests (vitest)
        run: npm run test
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: code/backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: code/frontend/package-lock.json
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-v1
      - name: Cache derived artifacts
        uses: actions/cache@v4
        with:
          path: .cache/llm-geometry
          key: llmgeo-cache-${{ runner.os }}-${{ hashFiles('code/backend/src/llm_geometry/geo/config.py') }}
      - name: Backend venv (playwright's webServer activates .venv)
        working-directory: code/backend
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          grep -v '^-e ' requirements.lock > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
          pip install -e . --no-deps
      - name: Export static assets (quick — powers the "static" e2e project)
        run: |
          . code/backend/.venv/bin/activate
          python scripts/export_static_assets.py --quick --git-sha "$GITHUB_SHA" --generated-at ci
      - name: Frontend install + browsers
        working-directory: code/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: e2e (both projects — chromium against the real backend, static against the built Pages bundle)
        working-directory: code/frontend
        run: npm run test:e2e
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: code/frontend/test-results/
          retention-days: 7
