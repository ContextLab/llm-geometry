[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-geometry"
version = "0.1.0"
description = "Core machinery for geometric LLM visualizations: model access, compute, precompute-and-cache, dimensionality reduction, and a JSON API."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2",
    "transformers>=4.40",
    "huggingface_hub>=0.23",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "umap-learn>=0.5.5",
    "open3d>=0.18",
    "datasets>=2.19",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "orjson>=3.10",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Both labs' training corpora ship with the package (public domain), so pip installs /
# containers / CI never re-download them. geo/ = Alice (PG #11); lex/ = The Real Mother
# Goose (PG #10607), committed whole with its licence footer intact.
llm_geometry = ["geo/data/*.txt", "lex/data/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
